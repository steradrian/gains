name: Deploy web

# Deploys the gains-web image that "Publish images to GHCR" just published for a push to main, to
# production (fit.adrianster.com). Only `web` is recreated: og-api, nutrition, hub and caddy keep
# their running containers, as the manual deploys did.
#
# Run it by hand (Actions → Deploy web → Run workflow, or `gh workflow run deploy-web.yml -f sha=…`)
# to redeploy or roll back to any SHA that has a published gains-web image.
#
# The server's .env is backed up to .env.pre-web-<ts> before every change. If the site does not
# answer afterwards, the job puts that backup back and recreates web on the previous image.
#
# Needs: secrets DEPLOY_SSH_KEY (private key for the deploy user) and DEPLOY_KNOWN_HOSTS (the
# server's pinned host keys), and variable DEPLOY_HOST (user@address).
on:
  workflow_run:
    workflows: [Publish images to GHCR]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of a published gains-web image (empty = the tip of main)
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A run by hand from another branch must never reach production.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      HOST: ${{ vars.DEPLOY_HOST }}
      SITE: https://fit.adrianster.com
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit SHA: $TAG"; exit 1; }
          [[ -n "$HOST" ]] || { echo "DEPLOY_HOST is not set"; exit 1; }
          echo "Deploying gains-web:$TAG"

      - name: Set up ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # A runner's first connection can drop with a silent exit 255 (seen on 2026-10-21); retry
      # until the server answers, so a network blip doesn't fail the deploy.
      - name: Reach the server
        run: |
          for i in 1 2 3 4 5; do
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$HOST" true && exit 0
            echo "ssh attempt $i failed (exit $?), retrying"
            sleep $((i * 5))
          done
          exit 1

      - name: Deploy web
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$HOST" "TAG=$TAG bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/fit/deploy
          docker compose config --services | grep -qx web
          # Pull before touching .env, so a SHA without an image changes nothing.
          OPENGYM_TAG="$TAG" docker compose pull -q web
          ts=$(date +%Y%m%d-%H%M%S)
          cp .env ".env.pre-web-$ts"
          echo "$ts" > .last-web-deploy
          echo "before: $(grep '^OPENGYM_TAG=' .env || echo unset)"
          grep -q '^OPENGYM_TAG=' .env || echo 'OPENGYM_TAG=' >> .env
          sed -i "s/^OPENGYM_TAG=.*/OPENGYM_TAG=$TAG/" .env
          echo "after:  $(grep '^OPENGYM_TAG=' .env)"
          grep -E '^(NUTRITRACE|HUB|CADDY)_TAG=' .env || true
          docker compose up -d --no-deps web
          docker compose ps web
          echo "Rollback: cd /srv/fit/deploy && cp .env.pre-web-$ts .env && docker compose up -d --no-deps web"
          REMOTE

      - name: Check the site
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$SITE"

      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/fit/deploy
          ts=$(cat .last-web-deploy)
          cp ".env.pre-web-$ts" .env
          docker compose up -d --no-deps web
          echo "Rolled back to: $(grep '^OPENGYM_TAG=' .env || echo unset)"
          REMOTE
