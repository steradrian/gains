name: Deploy web

# Deploys the gains-web and gains-api images that "Publish images to GHCR" just published for a push
# to main, to production (fit.adrianster.com). Both come from this repo and share OPENGYM_TAG, so
# `web` and `og-api` are recreated together and always run the same commit. Nutrition, hub and
# caddy keep their running containers.
#
# Run it by hand (Actions → Deploy web → Run workflow, or `gh workflow run deploy-web.yml -f sha=…`)
# to redeploy or roll back to any SHA that has a published gains-web image.
#
# The server's .env is backed up to .env.pre-web-<ts> before every change. If the site does not
# answer afterwards, the job puts that backup back and recreates web on the previous image.
#
# Needs: secrets DEPLOY_SSH_KEY (private key for the deploy user) and DEPLOY_KNOWN_HOSTS (the
# server's pinned host keys), and variable DEPLOY_HOST (user@address).
on:
  workflow_run:
    workflows: [Publish images to GHCR]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of a published gains-web image (empty = the tip of main)
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A run by hand from another branch must never reach production.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      HOST: ${{ vars.DEPLOY_HOST }}
      SITE: https://fit.adrianster.com
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit SHA: $TAG"; exit 1; }
          [[ -n "$HOST" ]] || { echo "DEPLOY_HOST is not set"; exit 1; }
          echo "Deploying gains-web:$TAG"

      - name: Set up ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # A runner's first connection can drop with a silent exit 255 (seen on 2026-10-21); retry
      # until the server answers, so a network blip doesn't fail the deploy.
      - name: Reach the server
        run: |
          for i in 1 2 3 4 5; do
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$HOST" true && exit 0
            echo "ssh attempt $i failed (exit $?), retrying"
            sleep $((i * 5))
          done
          exit 1

      # The second connection of a run has dropped with a silent exit 255 several times (2026-10-21),
      # so the deploy retries on 255. The script is safe to re-run: a retry after .env already holds
      # TAG keeps the earlier backup, so a rollback still goes to the image from before this run.
      - name: Deploy web
        id: deploy
        run: |
          cat > remote.sh <<'REMOTE'
          set -euo pipefail
          cd /srv/fit/deploy
          # Read the list once: `config | grep -q` exits as soon as grep matches, compose then
          # writes into a closed pipe and pipefail fails the script with 255, at random.
          services=$(docker compose config --services)
          grep -qx web <<<"$services"
          grep -qx og-api <<<"$services"
          # Pull before touching .env, so a SHA without an image changes nothing.
          OPENGYM_TAG="$TAG" docker compose pull -q web og-api
          if ! grep -qx "OPENGYM_TAG=$TAG" .env; then
            ts=$(date +%Y%m%d-%H%M%S)
            cp .env ".env.pre-web-$ts"
            echo "$ts" > .last-web-deploy
          fi
          ts=$(cat .last-web-deploy)
          echo "before: $(grep '^OPENGYM_TAG=' .env || echo unset)"
          grep -q '^OPENGYM_TAG=' .env || echo 'OPENGYM_TAG=' >> .env
          sed -i "s/^OPENGYM_TAG=.*/OPENGYM_TAG=$TAG/" .env
          echo "after:  $(grep '^OPENGYM_TAG=' .env)"
          grep -E '^(NUTRITRACE|HUB|CADDY)_TAG=' .env || true
          docker compose up -d --no-deps web og-api
          docker compose ps web og-api
          echo "Rollback: cd /srv/fit/deploy && cp .env.pre-web-$ts .env && docker compose up -d --no-deps web og-api"
          REMOTE
          for i in 1 2 3 4 5; do
            rc=0
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "$HOST" "TAG=$TAG bash -s" < remote.sh || rc=$?
            [[ $rc -eq 0 ]] && exit 0
            [[ $rc -eq 255 ]] || exit "$rc"
            echo "ssh dropped with 255 (attempt $i); connection debug:"
            ssh -v -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$HOST" true 2>&1 | tail -8 || true
            sleep $((i * 15))
          done
          exit 255

      - name: Check the site
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$SITE"

      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/fit/deploy
          ts=$(cat .last-web-deploy)
          cp ".env.pre-web-$ts" .env
          docker compose up -d --no-deps web og-api
          echo "Rolled back to: $(grep '^OPENGYM_TAG=' .env || echo unset)"
          REMOTE
